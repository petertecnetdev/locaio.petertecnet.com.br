name: Frontend CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validar sintaxe do smoke de produção
        run: node --check scripts/production-smoke.mjs
      - name: Validar sintaxe do fluxo crítico de locação
        run: node --check scripts/critical-flow-smoke.mjs
      - name: Executar verificações completas da aplicação
        run: npm run check
