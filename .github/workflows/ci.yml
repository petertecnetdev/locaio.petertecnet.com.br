name: Frontend CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Validate frontend architecture
        run: node scripts/architecture-guard.mjs
      - name: Validate production smoke syntax
        run: node --check scripts/production-smoke.mjs
      - run: npm run build
