name: Verify Google Login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/verify-google-login.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser smoke dependency
        run: npm install --no-save --package-lock=false puppeteer-core@latest

      - name: Verify Google button and provider configuration
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'Chrome/Chromium não encontrado.' >&2; exit 1; }
          BROWSER="$BROWSER" SMOKE_SCOPE=google node scripts/production-smoke.mjs
