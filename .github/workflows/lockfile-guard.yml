name: Dependency Lockfile Guard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure-lockfile:
    name: Ensure package-lock.json exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Generate missing lockfile
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'package-lock.json já está versionado.'
            exit 0
          fi

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit generated lockfile
        if: steps.lockfile.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: lock frontend dependencies'
          git push origin HEAD:main
