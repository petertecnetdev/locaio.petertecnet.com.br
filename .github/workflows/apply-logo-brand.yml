name: Apply official Locaio logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-logo-brand.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace legacy brand mark with official PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text()
          old = '''function Brand({ compact = false }) {
            return <div className={`brand ${compact ? 'compact' : ''}`}><span className="brand-mark"><span /></span><div><strong>Locaio</strong>{!compact && <small>by Peter Tecnet</small>}</div></div>;
          }'''
          new = '''function Brand({ compact = false }) {
            return <div className={`brand ${compact ? 'compact' : ''}`}><img className="brand-logo" src="/logo-locaio.png?v=20260903-2" alt="Locaio" /><div><strong>Locaio</strong>{!compact && <small>by Peter Tecnet</small>}</div></div>;
          }'''
          if old not in text:
              raise SystemExit('Legacy Brand function not found; refusing unsafe replacement.')
          text = text.replace(old, new, 1)
          app.write_text(text)

          Path('src/brand.css').write_text('''.brand-logo{\n  display:block;\n  width:42px;\n  height:42px;\n  flex:0 0 42px;\n  object-fit:cover;\n  border-radius:50%;\n  box-shadow:0 10px 28px rgba(35,88,255,.20);\n}\n.brand.compact .brand-logo{width:36px;height:36px;flex-basis:36px}\n.auth-hero .brand-logo{box-shadow:0 12px 34px rgba(35,88,255,.28)}\n.sidebar .brand-logo{box-shadow:0 8px 22px rgba(35,88,255,.18)}\n@media(max-width:640px){.auth-hero .brand-logo{width:46px;height:46px;flex-basis:46px}}\n''')

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('href="/logo-locaio.png"', 'href="/logo-locaio.png?v=20260903-2"')
          if 'rel="shortcut icon"' not in html:
              html = html.replace('<link rel="icon" type="image/png" href="/logo-locaio.png?v=20260903-2" />', '<link rel="icon" type="image/png" href="/logo-locaio.png?v=20260903-2" />\n    <link rel="shortcut icon" type="image/png" href="/logo-locaio.png?v=20260903-2" />')
          if 'property="og:image"' not in html:
              html = html.replace('<link rel="canonical" href="https://locaio.petertecnet.com.br/" />', '<link rel="canonical" href="https://locaio.petertecnet.com.br/" />\n    <meta property="og:image" content="https://locaio.petertecnet.com.br/logo-locaio.png?v=20260903-2" />')
          index.write_text(html)
          PY

          test -f public/logo-locaio.png
          test ! -e public/logo.svg
          ! grep -R --line-number --fixed-string 'logo.svg' src public index.html || false
          grep -Fq '<img className="brand-logo"' src/App.jsx
          grep -Fq '/logo-locaio.png?v=20260903-2' index.html

      - name: Validate production build
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
          grep -Fq 'Locaio' dist/index.html
          test -f dist/logo-locaio.png

      - name: Commit structural brand migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-logo-brand.yml
          git config user.name 'Peter Tecnet Automation'
          git config user.email 'petertecnet@gmail.com'
          git add src/App.jsx src/brand.css index.html .github/workflows/apply-logo-brand.yml
          git diff --cached --check
          git commit -m 'fix: use official Locaio logo everywhere'
          git pull --rebase origin main
          git push origin HEAD:main
